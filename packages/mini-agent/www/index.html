<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Agent (SLA)</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 44rem; padding: 0 1rem; }
#answer { white-space: pre-wrap; border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 6rem; }
textarea { width: 100%; box-sizing: border-box; }
button { margin-top: 0.5rem; padding: 0.4rem 1.2rem; }
.meta { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Mini Agent <span class="meta">SLA backend · Kilo free channel</span></h1>
<textarea id="prompt" rows="3" placeholder="Ask something...">Reply with exactly: ok</textarea>
<br>
<button id="send">Send</button>
<span class="meta" id="status"></span>
<h2>Answer</h2>
<div id="answer"></div>
<script>
const btn = document.getElementById('send');
const out = document.getElementById('answer');
const status = document.getElementById('status');
btn.addEventListener('click', async () => {
  const prompt = document.getElementById('prompt').value;
  out.textContent = '';
  status.textContent = 'streaming...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt})
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let idx;
      while ((idx = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const obj = JSON.parse(data);
          const delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
          if (delta && typeof delta.content === 'string') out.textContent += delta.content;
        } catch (e) { /* partial or non-JSON line */ }
      }
    }
    status.textContent = 'done';
  } catch (err) {
    status.textContent = 'error: ' + err;
  }
  btn.disabled = false;
});
</script>
</body>
</html>
