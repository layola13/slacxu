name: codex-free-key

services:
  free-key-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: codex-ultra/free-key-server:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      FREE_KEY_HOST: 0.0.0.0
      FREE_KEY_PORT: 43210
      FREE_KEY_DATABASE: /app/data/free-keys.sqlite3
    volumes:
      - ../data:/app/data
    expose:
      - "43210"
    networks:
      - free-key-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:43210/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      free-key-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - free-key-network
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  free-key-network:
    driver: bridge
